<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — FudCo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-6 md:mb-8">
      <div class="w-14 h-14 md:w-16 md:h-16 bg-emerald-600 rounded-2xl flex items-center
                  justify-center mx-auto mb-3 md:mb-4 shadow-lg">
        <i class="fa-solid fa-store text-white text-xl md:text-2xl"></i>
      </div>
      <h1 class="text-xl md:text-2xl font-bold text-slate-800">FudCo</h1>
      <p class="text-slate-500 text-sm mt-1">Inventory &amp; Point of Sale</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h2 class="text-base md:text-lg font-semibold text-slate-800 mb-5 md:mb-6">
        Sign in to your account
      </h2>

      {% if messages %}
        {% for message in messages %}
          <div class="mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700
                      text-sm flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation shrink-0"></i>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="space-y-4 md:space-y-5">

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2
                        text-slate-400 text-sm"></i>
              <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
                autofocus
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm
                       focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent
                       bg-slate-50 text-slate-800 placeholder-slate-400"/>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2
                        text-slate-400 text-sm"></i>
              <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm
                       focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent
                       bg-slate-50 text-slate-800 placeholder-slate-400"/>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3
                   rounded-xl transition-colors text-sm">
            Sign in
          </button>

        </div>
      </form>
    </div>


  </div>

</body>
</html>
